# GitHub Actions CI/CD deployment pipeline for Sachthali repository.
# Installs dependencies, initializes PostgreSQL test database, runs Vitest unit tests, and verifies frontend build.
name: Sachthali CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sachthalidb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci

      - name: Generate Prisma client & migrate test schema
        env:
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/sachthalidb'
        run: |
          cd backend
          npx prisma generate
          npx prisma db push --skip-generate

      - name: Run Vitest test suite
        env:
          NODE_ENV: test
          VITEST: 'true'
          CI: 'true'
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/sachthalidb'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'mock_gemini_api_key_ci_testing_123' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'mock_jwt_secret_key_ci_testing_123' }}
        run: |
          cd backend
          npm test

      - name: Verify frontend production build
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Trigger Render deploy hook (if configured)
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
        run: |
          curl -s "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      - name: Trigger Vercel deploy hook (if configured)
        if: ${{ secrets.VERCEL_DEPLOY_HOOK_URL != '' }}
        run: |
          curl -s "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"

